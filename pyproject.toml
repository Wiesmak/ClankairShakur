[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clankair_shakur"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "discord-py==2.7.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy==2.5.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
]

[project.scripts]
clankair-shakur = "clankair_shakur.app:main"
