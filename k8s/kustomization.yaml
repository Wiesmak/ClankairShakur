apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - imagestream.yaml
  - serviceaccount.yaml
  - configmap.yaml

images:
  - name: clankair-shakur
    newName: image-registry.openshift-image-registry.svc:5000/clankair/clankair-shakur
    newTag: v1.0.0

labels:
  - pairs:
      app: clankair-shakur
      app.kubernetes.io/part-of: clankair-shakur
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/component: server