apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-clankair-shakur-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/*]"
spec:
  pipelineRef:
    name: build-clankair-shakur

  serviceAccountName: pipeline

  params:
    - name: repo-url
      value: https://github.com/wiesmak/clankairshakur.git

    - name: revision
      value: master

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 2Gi